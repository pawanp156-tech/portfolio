name: Build and publish

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# Needed to force-push the built site to the deploy branch.
permissions:
  contents: write

# Two runs pushing the deploy branch at once would race. Queue instead.
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish to deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile is out of sync — `npm install` would quietly resolve new
      # versions and could publish something that was never tested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Hostinger's Git integration clones a branch as-is; it never runs a build.
      # Pointing it at `main` therefore serves raw source — index.html asking the
      # browser for /src/main.jsx, which it cannot execute. This branch holds the
      # contents of dist/ at its root, so a plain clone is already a working site.
      - name: Publish dist to the deploy branch
        run: |
          cd dist

          # A fresh repo each run, force-pushed: the deploy branch is a snapshot
          # of the current build, not a history worth keeping.
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA:0:7}"

          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            deploy

          echo "Published $(git ls-files | wc -l) files to the deploy branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Optional: if you enable auto-deployment in hPanel, paste the webhook URL
      # into a HOSTINGER_DEPLOY_WEBHOOK secret and Hostinger pulls immediately.
      # Without it, click Deploy in hPanel after each run.
      - name: Trigger Hostinger deployment
        env:
          WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::HOSTINGER_DEPLOY_WEBHOOK not set — pull the deploy branch manually in hPanel."
            exit 0
          fi
          curl -fsS --max-time 30 "$WEBHOOK" && echo "Hostinger deployment triggered."

      # Publishing a branch proves nothing about what the domain serves. This
      # checks the live site is actually running the build that was just made.
      - name: Verify the live site
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::warning::SITE_URL is not set, so the deploy was not verified. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi

          ASSET=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          echo "Checking $SITE_URL for $ASSET"

          # Hostinger may take a moment to pull, so allow a few attempts.
          for i in 1 2 3 4 5 6; do
            LIVE=$(curl -fsSL --max-time 30 "$SITE_URL" || true)
            if echo "$LIVE" | grep -q "$ASSET"; then
              echo "Live site is serving this build."
              exit 0
            fi
            echo "Attempt $i: not live yet, waiting..."
            sleep 15
          done

          echo "::error::$SITE_URL is not serving this build. If hPanel > Git still points at 'main', switch it to the 'deploy' branch — 'main' holds source that Hostinger does not build."
          exit 1
